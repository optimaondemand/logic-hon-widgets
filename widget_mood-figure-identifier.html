<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mood and Figure Identifier</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, system-ui, -apple-system, sans-serif;
    background: #f5f5f3;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 16px;
  }

  .container { width: 100%; max-width: 660px; background: #ffffff; border: 1px solid #d8d8d4; border-radius: 6px; overflow: hidden; }

  .header { background: #1e2530; color: #ffffff; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .header-title { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #c8cdd6; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .progress-text { font-size: 13px; color: #9aa0ac; white-space: nowrap; }
  .score-badge { background: #2c3547; border: 1px solid #3a4560; border-radius: 20px; padding: 4px 12px; font-size: 13px; font-weight: 600; color: #e8eaf0; white-space: nowrap; }
  .progress-bar-track { height: 4px; background: #e0e0dc; }
  .progress-bar-fill { height: 100%; background: #1e2530; transition: width 0.35s ease; }

  .content { padding: 22px 24px 20px; }

  .syllogism-box {
    background: #f9f8f5; border: 1px solid #dddbd4; border-left: 4px solid #1e2530;
    border-radius: 4px; padding: 16px 20px; margin-bottom: 18px;
    font-family: Georgia, 'Times New Roman', serif; font-size: 15.5px; line-height: 1.65;
  }

  .step-label { font-size: 12.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #666; margin: 14px 0 8px; }

  .option-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  .option-btn {
    flex: 1 1 130px; padding: 10px 14px; border: 2px solid #d8d8d4; border-radius: 4px;
    background: #ffffff; color: #1a1a1a; font-family: Arial, sans-serif; font-size: 14px;
    font-weight: 600; cursor: pointer; text-align: center;
  }
  .option-btn:hover:not(:disabled) { border-color: #1e2530; background: #f2f3f5; }
  .option-btn:disabled { cursor: default; }
  .option-btn.selected-correct { background: #2d7a2d; border-color: #2d7a2d; color: #fff; }
  .option-btn.selected-incorrect { background: #a02020; border-color: #a02020; color: #fff; }
  .option-btn.revealed-correct { background: #2d7a2d; border-color: #2d7a2d; color: #fff; }
  .option-btn.dimmed { opacity: 0.5; }

  .figure-diagram { font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.5; white-space: pre; }

  .feedback-box { border-radius: 4px; padding: 14px 16px; margin: 14px 0; display: none; }
  .feedback-box.correct { background: #eef7ee; border: 1px solid #a3cfa3; }
  .feedback-box.incorrect { background: #fdf0f0; border: 1px solid #d4a0a0; }
  .feedback-box.summary { background: #eaf2fb; border: 1px solid #a9c8e8; }
  .feedback-verdict { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .feedback-box.correct .feedback-verdict { color: #2d7a2d; }
  .feedback-box.incorrect .feedback-verdict { color: #a02020; }
  .feedback-box.summary .feedback-verdict { color: #1a4a7a; }
  .feedback-explanation { font-size: 13.5px; line-height: 1.55; color: #333330; }

  .next-btn {
    display: none; width: 100%; padding: 12px 20px; background: #1e2530; color: #fff;
    border: none; border-radius: 4px; font-family: Arial, sans-serif; font-size: 14px;
    font-weight: 600; cursor: pointer; letter-spacing: 0.03em; margin-top: 6px;
  }
  .next-btn:hover { background: #2c3a50; }

  .results-screen { display: none; padding: 24px; text-align: center; }
  .results-heading { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .results-score-display { font-size: 52px; font-weight: 700; color: #1e2530; line-height: 1.1; margin: 18px 0 8px; }
  .results-score-label { font-size: 15px; color: #666660; margin-bottom: 22px; }
  .results-message { font-size: 15px; color: #444440; line-height: 1.6; max-width: 460px; margin: 0 auto 28px; }
  .try-again-btn {
    display: inline-block; padding: 12px 36px; background: #1e2530; color: #fff; border: none;
    border-radius: 4px; font-family: Arial, sans-serif; font-size: 15px; font-weight: 600;
    cursor: pointer; letter-spacing: 0.03em;
  }
  .try-again-btn:hover { background: #2c3a50; }
  .results-divider { border: none; border-top: 1px solid #e0e0dc; margin: 22px 0; }

  @media (max-width: 480px) {
    .content { padding: 16px 16px 14px; }
    .option-btn { flex: 1 1 100%; }
  }
</style>
</head>
<body>

<div class="container" id="app">

  <div id="question-screen">
    <div class="header">
      <span class="header-title">Mood and Figure Identifier</span>
      <div class="header-right">
        <span class="progress-text" id="progress-text">Syllogism 1 of 6</span>
        <span class="score-badge" id="score-badge">Score: 0 / 0</span>
      </div>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-bar-fill" style="width:0%"></div></div>

    <div class="content">
      <div class="syllogism-box" id="syllogism-box"></div>

      <div id="step-mood">
        <div class="step-label">Step 1 — What is the mood? (statement type of major premise, minor premise, conclusion, in order)</div>
        <div class="option-grid" id="mood-options"></div>
      </div>

      <div id="step-figure" style="display:none">
        <div class="step-label">Step 2 — What is the figure? (position of the middle term, M, in the two premises)</div>
        <div class="option-grid" id="figure-options"></div>
      </div>

      <div class="feedback-box" id="mood-feedback"></div>
      <div class="feedback-box" id="figure-feedback"></div>
      <div class="feedback-box" id="summary-feedback"></div>

      <button class="next-btn" id="next-btn" onclick="handleNext()">Next Syllogism &rarr;</button>
    </div>
  </div>

  <div class="results-screen" id="results-screen">
    <div class="results-heading">Quiz Complete</div>
    <div class="results-score-display" id="final-score-display"></div>
    <div class="results-score-label">correct out of 6 (mood + figure combined)</div>
    <hr class="results-divider">
    <p class="results-message" id="results-message"></p>
    <button class="try-again-btn" onclick="resetQuiz()">Try Again</button>
  </div>

</div>

<script>
  var FIGURES = {
    1: "Figure 1 — M - P\n         S - M\n(M is subject of major premise, predicate of minor)",
    2: "Figure 2 — P - M\n         S - M\n(M is predicate of both premises)",
    3: "Figure 3 — M - P\n         M - S\n(M is subject of both premises)",
    4: "Figure 4 — P - M\n         M - S\n(M is predicate of major premise, subject of minor)"
  };

  var bank = [
    {
      major: "All reptiles are cold-blooded. (M-P)",
      minor: "All lizards are reptiles. (S-M)",
      concl: "Therefore, all lizards are cold-blooded. (S-P)",
      mood: "AAA", figure: 1, name: "Barbara"
    },
    {
      major: "No fish are mammals. (M-P)",
      minor: "All whales are mammals. (S-M — note M is predicate here)",
      concl: "Therefore, no whales are fish. (S-P)",
      mood: "EAE", figure: 2, name: "Cesare",
      majorNote: "M-P here really means the middle term (mammals) is the predicate of the major premise, and also the predicate of the minor premise — that combination is Figure 2, not Figure 1."
    },
    {
      major: "Some historians are novelists. (M-P)",
      minor: "All historians are readers of primary sources. (M-S — M is subject of both)",
      concl: "Therefore, some readers of primary sources are novelists. (P-S conclusion, restated as S-P)",
      mood: "IAI", figure: 3, name: "Disamis"
    },
    {
      major: "All poets are dreamers. (P-M — M is predicate of major)",
      minor: "No dreamers are pragmatists. (M-S — M is subject of minor)",
      concl: "Therefore, no pragmatists are poets. (S-P)",
      mood: "AEE", figure: 4, name: "Camenes"
    },
    {
      major: "No amphibians are warm-blooded. (M-P)",
      minor: "Some vertebrates are amphibians. (S-M)",
      concl: "Therefore, some vertebrates are not warm-blooded. (S-P)",
      mood: "EIO", figure: 1, name: "Ferio"
    },
    {
      major: "All squares are quadrilaterals. (P-M)",
      minor: "No triangles are quadrilaterals. (S-M)",
      concl: "Therefore, no triangles are squares. (S-P)",
      mood: "AEE", figure: 2, name: "Camestres"
    }
  ];

  var order = [];
  var idx = 0;
  var score = 0;
  var answeredCount = 0;
  var current = null;
  var moodDone = false, figureDone = false;
  var moodCorrect = false, figureCorrect = false;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  var ALL_MOODS = ["AAA", "EAE", "AII", "EIO", "IAI", "AEE", "OAO", "EAO"];
  var ALL_FIGURES = [1, 2, 3, 4];

  function moodOptions(correctMood) {
    var pool = ALL_MOODS.filter(function (m) { return m !== correctMood; });
    var picks = shuffle(pool).slice(0, 3);
    return shuffle([correctMood].concat(picks));
  }

  function loadSyllogism() {
    if (idx >= order.length) { order = shuffle([0, 1, 2, 3, 4, 5]); idx = 0; }
    current = bank[order[idx]];
    idx++;

    moodDone = false; figureDone = false;
    moodCorrect = false; figureCorrect = false;

    document.getElementById('progress-text').textContent = 'Syllogism ' + idx + ' of ' + bank.length;
    document.getElementById('progress-bar-fill').style.width = (((idx - 1) / bank.length) * 100) + '%';

    document.getElementById('syllogism-box').innerHTML =
      'Major premise: ' + current.major + '<br>' +
      'Minor premise: ' + current.minor + '<br>' +
      '<em>' + current.concl + '</em>';

    document.getElementById('step-mood').style.display = 'block';
    document.getElementById('step-figure').style.display = 'none';
    document.getElementById('mood-feedback').style.display = 'none';
    document.getElementById('figure-feedback').style.display = 'none';
    document.getElementById('summary-feedback').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';

    var moodBox = document.getElementById('mood-options');
    moodBox.innerHTML = '';
    moodOptions(current.mood).forEach(function (m) {
      var btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = m;
      btn.onclick = function () { handleMoodAnswer(m, btn); };
      moodBox.appendChild(btn);
    });
  }

  function handleMoodAnswer(chosen, btnEl) {
    if (moodDone) return;
    moodDone = true;
    moodCorrect = (chosen === current.mood);

    document.querySelectorAll('#mood-options .option-btn').forEach(function (b) {
      b.disabled = true;
      if (b === btnEl) {
        b.className = 'option-btn ' + (moodCorrect ? 'selected-correct' : 'selected-incorrect');
      } else if (b.textContent === current.mood) {
        b.className = 'option-btn revealed-correct';
      } else {
        b.className = 'option-btn dimmed';
      }
    });

    var fb = document.getElementById('mood-feedback');
    fb.style.display = 'block';
    fb.className = 'feedback-box ' + (moodCorrect ? 'correct' : 'incorrect');
    fb.innerHTML = '<div class="feedback-verdict">' + (moodCorrect ? 'Correct mood: ' : 'The mood is: ') + current.mood + '</div>' +
      '<div class="feedback-explanation">Major premise is ' + current.mood[0] + ', minor premise is ' + current.mood[1] + ', conclusion is ' + current.mood[2] + '.</div>';

    document.getElementById('step-figure').style.display = 'block';
    var figBox = document.getElementById('figure-options');
    figBox.innerHTML = '';
    shuffle(ALL_FIGURES).forEach(function (f) {
      var btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = 'Figure ' + f;
      btn.onclick = function () { handleFigureAnswer(f, btn); };
      figBox.appendChild(btn);
    });
  }

  function handleFigureAnswer(chosen, btnEl) {
    if (figureDone) return;
    figureDone = true;
    figureCorrect = (chosen === current.figure);
    answeredCount++;
    if (moodCorrect && figureCorrect) score++;
    document.getElementById('score-badge').textContent = 'Score: ' + score + ' / ' + answeredCount;

    document.querySelectorAll('#figure-options .option-btn').forEach(function (b) {
      b.disabled = true;
      if (b === btnEl) {
        b.className = 'option-btn ' + (figureCorrect ? 'selected-correct' : 'selected-incorrect');
      } else if (b.textContent === 'Figure ' + current.figure) {
        b.className = 'option-btn revealed-correct';
      } else {
        b.className = 'option-btn dimmed';
      }
    });

    var fb = document.getElementById('figure-feedback');
    fb.style.display = 'block';
    fb.className = 'feedback-box ' + (figureCorrect ? 'correct' : 'incorrect');
    fb.innerHTML = '<div class="feedback-verdict">' + (figureCorrect ? 'Correct figure: ' : 'The figure is: ') + current.figure + '</div>' +
      '<div class="feedback-explanation" style="white-space:pre-line;">' + FIGURES[current.figure] + (current.majorNote ? ('\n\n' + current.majorNote) : '') + '</div>';

    var summary = document.getElementById('summary-feedback');
    summary.style.display = 'block';
    summary.className = 'feedback-box summary';
    summary.innerHTML = '<div class="feedback-verdict">Full code: ' + current.mood + '-' + current.figure + (current.name ? ' (' + current.name + ')' : '') + '</div>' +
      '<div class="feedback-explanation">Mood names the sequence of statement types; figure names the middle term\'s position. Together they identify one of the 15 valid syllogistic forms this course works with.</div>';

    document.getElementById('next-btn').style.display = 'block';
    document.getElementById('next-btn').textContent = (idx === bank.length) ? 'See Results' : 'Next Syllogism →';
  }

  function handleNext() {
    if (idx >= bank.length) {
      showResults();
    } else {
      loadSyllogism();
    }
  }

  function showResults() {
    document.getElementById('question-screen').style.display = 'none';
    document.getElementById('results-screen').style.display = 'block';
    document.getElementById('final-score-display').textContent = score;

    var pct = score / bank.length;
    var msg;
    if (pct === 1) {
      msg = "Perfect score. You correctly named both the mood and the figure for every syllogism — the two pieces of information that together identify a syllogistic form completely.";
    } else if (pct >= 0.6) {
      msg = "Solid work. If you missed any figures, remember: figure depends only on where the middle term (M) sits in the two premises — subject or predicate of each — not on the mood at all.";
    } else {
      msg = "Mood and figure are independent pieces of information: mood is about statement types (A/E/I/O), figure is about where M sits. Review Lessons 5.03c (figures) and 5.05a–b (mood), then try again.";
    }
    document.getElementById('results-message').textContent = msg;
  }

  function resetQuiz() {
    score = 0; answeredCount = 0; idx = 0;
    order = shuffle([0, 1, 2, 3, 4, 5]);
    document.getElementById('results-screen').style.display = 'none';
    document.getElementById('question-screen').style.display = 'block';
    loadSyllogism();
  }

  order = shuffle([0, 1, 2, 3, 4, 5]);
  loadSyllogism();
</script>

</body>
</html>
